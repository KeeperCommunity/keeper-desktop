name: PGP release handoff preflight

# Automatic workflow_run signing is intentionally removed. In particular,
# successful QA builds must never select or mutate an unrelated draft release.
on:
  workflow_dispatch:
    inputs:
      approved_manifest_json:
        description: Exact reviewed JSON (release_id, tag, source_sha, build_run_id, complete assets with IDs/names/sizes/SHA-256)
        required: true
        type: string
      approved_manifest_sha256:
        description: SHA-256 of those exact UTF-8 JSON bytes (no added newline)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-pgp-handoff-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow implementation only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate handoff guard contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_desktop_pgp_handoff.py'
      - name: Read exact approved release and build metadata
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_MANIFEST: ${{ inputs.approved_manifest_json }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPROVED_MANIFEST" > "$RUNNER_TEMP/desktop-approved-manifest.json"
          release_id=$(jq -er '.release_id | select(type == "number" and . > 0 and . == floor)' "$RUNNER_TEMP/desktop-approved-manifest.json")
          build_run_id=$(jq -er '.build_run_id | select(type == "number" and . > 0 and . == floor)' "$RUNNER_TEMP/desktop-approved-manifest.json")
          gh api "repos/KeeperCommunity/keeper-desktop/releases/$release_id" > "$RUNNER_TEMP/desktop-release.json"
          gh api "repos/KeeperCommunity/keeper-desktop/actions/runs/$build_run_id" > "$RUNNER_TEMP/desktop-build-run.json"
          gh api "repos/KeeperCommunity/keeper-desktop/actions/runs/$build_run_id/jobs?per_page=100" > "$RUNNER_TEMP/desktop-build-jobs.json"
      - name: Validate explicit production handoff
        env:
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
        run: |
          python3 .github/scripts/validate_desktop_pgp_handoff.py \
            --manifest "$RUNNER_TEMP/desktop-approved-manifest.json" \
            --manifest-sha256 "$APPROVED_MANIFEST_SHA256" \
            --release "$RUNNER_TEMP/desktop-release.json" \
            --run "$RUNNER_TEMP/desktop-build-run.json" \
            --jobs "$RUNNER_TEMP/desktop-build-jobs.json" \
            --output "$RUNNER_TEMP/desktop-pgp-handoff-plan.json"
          echo 'Read-only preflight passed. Signing, upload and publication remain NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
      # No signing secrets, private-key import, release upload or publication here.

