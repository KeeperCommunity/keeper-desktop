name: "release"

on:
  workflow_dispatch:
    inputs:
      qa_only:
        description: Build an unsigned QA app without creating or updating a release
        type: boolean
        default: false
  push:
    branches:
      - release

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  build-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.qa_only
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend and pinned HWI dependencies
        run: npm ci
      - name: Prepare separate QA identity
        run: |
          python3 - <<'PYQA'
          import json
          from pathlib import Path
          config = {
            "package": {"productName": "Keeper Desktop R3 QA", "version": "0.2.6-qa.1"},
            "tauri": {"bundle": {"identifier": "com.keeper.desktop.r3qa", "macOS": {"signingIdentity": "-"}}}
          }
          Path("src-tauri/tauri.qa.conf.json").write_text(json.dumps(config))
          PYQA
      - name: Build QA application only
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.qa.conf.json
      - name: Verify QA metadata and endpoint
        run: |
          python3 - <<'PYQA'
          import json, plistlib, hashlib
          from pathlib import Path
          app = next(Path("src-tauri/target/aarch64-apple-darwin/release/bundle/macos").glob("*.app"))
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
          binary = executable.read_bytes()
          assert info["CFBundleIdentifier"] == "com.keeper.desktop.r3qa"
          assert info["CFBundleShortVersionString"] == "0.2.6-qa.1"
          assert b"https://channel.bitcoinkeeper.app/" in binary
          assert b"https://keeper-channel.herokuapp.com/" not in binary
          Path("desktop-qa-evidence.json").write_text(json.dumps({
            "version": info["CFBundleShortVersionString"], "identifier": info["CFBundleIdentifier"],
            "executable_sha256": hashlib.sha256(binary).hexdigest(), "live_endpoint": True,
            "source": "${{ github.sha }}", "signing": "ad hoc QA; not production notarized"
          }, indent=2))
          PYQA
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Keeper Desktop R3 QA.app" keeper-desktop-r3-qa.zip
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-desktop-r3-qa-${{ github.sha }}
          path: |
            keeper-desktop-r3-qa.zip
            desktop-qa-evidence.json
          retention-days: 14

  publish-tauri:
    if: github.event_name != 'workflow_dispatch' || !inputs.qa_only
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@1.85.1
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: import windows certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: install frontend dependencies
        run: npm install

      - name: update app icon
        run: npm run tauri icon app-icons/release-icon.png

      - uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: keeper-desktop-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Keeper Desktop v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
